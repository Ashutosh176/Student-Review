<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CampusTruth — Figma Screens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#2A3B7C;
  --indigo-dark:#1B2757;
  --indigo-deep:#161B33;
  --indigo-light:#EEF0FA;
  --ink:#14161F;
  --sub:#6B7078;
  --line:#E3E5EC;
  --bg:#F6F7F8;
  --green:#187A52;
  --green-bg:#E7F5EE;
  --amber:#A9660A;
  --amber-bg:#FCF1DE;
  --red:#B23A34;
  --red-bg:#FBEAE8;
  --info:#2F5FD1;
  --info-bg:#EAF0FD;
  --radius:10px;
  --shadow:0 1px 2px rgba(16,24,32,.06), 0 1px 1px rgba(16,24,32,.04);
  --frame-w:1440px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'IBM Plex Sans',system-ui,sans-serif; color:var(--ink); background:#EDEEF0; -webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Manrope',sans-serif; font-weight:700; letter-spacing:-.01em; margin:0;}
a{color:inherit; text-decoration:none;}
.app{display:flex; height:100vh; overflow:hidden;}

/* ===== Left panel: Figma-style page list ===== */
.panel{width:250px; min-width:250px; background:#22262C; color:#D7D9DC; display:flex; flex-direction:column; border-right:1px solid #1B1D20;}
.panel-head{padding:16px 16px 10px; border-bottom:1px solid #383C42;}
.panel-head .brandrow{display:flex; align-items:center; gap:8px;}
.panel-head .mark{width:24px; height:24px; border-radius:6px; background:var(--indigo); display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Manrope'; font-weight:800; font-size:11px;}
.panel-head .ttl{font-size:12.5px; font-weight:700; color:#fff; letter-spacing:.2px;}
.panel-head .sub{font-size:11px; color:#9AA0A6; margin-top:4px;}
.panel-scroll{flex:1; overflow-y:auto; padding:8px 8px 20px;}
.group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:#83898F; padding:14px 10px 6px;}
.page-item{display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:7px; cursor:pointer; font-size:12.8px; color:#C7CBCF; margin:1px 0;}
.page-item .num{width:18px; height:18px; border-radius:4px; background:#3E4247; color:#9AA0A6; font-size:9.5px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-weight:700;}
.page-item:hover{background:#2E3238; color:#fff;}
.page-item.active{background:var(--indigo-dark); color:#fff;}
.page-item.active .num{background:var(--indigo); color:#fff;}
.panel-foot{padding:12px 16px; border-top:1px solid #383C42; font-size:10.8px; color:#83898F; line-height:1.5;}
.panel-foot b{color:#C7CBCF;}

/* ===== Canvas ===== */
.canvas{flex:1; overflow:auto; background:radial-gradient(#DCDEE1 1px, transparent 1px) 0 0/16px 16px, #E7E9EB; padding:40px;}
.frame-wrap{max-width:var(--frame-w); margin:0 auto;}
.frame-label{font-size:12.5px; font-weight:700; color:#4A4E53; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.frame-label .dot{width:7px; height:7px; border-radius:50%; background:var(--indigo);}
.frame{width:var(--frame-w); background:#fff; box-shadow:0 1px 30px rgba(0,0,0,.12); border-radius:4px; overflow:hidden;}

/* ===== Shared: trust strip ===== */
.topstrip{background:var(--indigo-deep); color:#C9CDD0; font-size:11.5px; display:flex; align-items:center; justify-content:space-between; padding:7px 28px;}
.topstrip .left{display:flex; gap:20px;}
.topstrip .left span{display:flex; align-items:center; gap:6px;}
.topstrip .left span::before{content:'✓'; color:#7C8CE0; font-size:10px; font-weight:800;}
.topstrip .right{display:flex; gap:18px;}

/* ===== Public header ===== */
.site-header{background:#fff; border-bottom:1px solid var(--line);}
.header-row{display:flex; align-items:center; gap:24px; padding:14px 28px;}
.logo{display:flex; align-items:center; gap:8px; font-family:'Manrope'; font-weight:800; font-size:17px; flex:none;}
.logo .mark{width:26px; height:26px; border-radius:7px; background:var(--indigo); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px;}
.main-nav{display:flex; gap:24px; font-size:13.5px; font-weight:600; color:#33373A;}
.header-search{flex:1; max-width:420px; display:flex;}
.header-search input{flex:1; border:1px solid var(--line); border-right:none; padding:9px 12px; border-radius:7px 0 0 7px; font-size:12.5px; font-family:inherit;}
.header-search button{background:var(--indigo); color:#fff; border:none; padding:0 16px; border-radius:0 7px 7px 0; font-weight:600; font-size:12.5px; cursor:pointer;}
.header-actions{display:flex; align-items:center; gap:10px; flex:none; margin-left:auto;}
.avatar{width:32px; height:32px; border-radius:50%; background:var(--indigo-light); color:var(--indigo); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; font-family:'Manrope';}

/* ===== Buttons ===== */
.btn{font-family:inherit; font-weight:600; font-size:13px; border-radius:7px; border:1px solid var(--line); padding:9px 16px; cursor:pointer; background:#fff; display:inline-flex; align-items:center; gap:6px;}
.btn-primary{background:var(--indigo); color:#fff; border-color:var(--indigo);}
.btn-ghost{background:transparent; border-color:var(--line);}
.btn-danger{color:var(--red); border-color:var(--red);}
.btn-sm{padding:6px 12px; font-size:12px;}

/* ===== Badges ===== */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 10px; border-radius:999px;}
.badge-verified{background:var(--green-bg); color:var(--green);}
.badge-org{background:var(--info-bg); color:var(--info);}
.badge-official{background:var(--indigo-light); color:var(--indigo);}
.badge-pending{background:var(--amber-bg); color:var(--amber);}
.badge-flagged{background:var(--red-bg); color:var(--red);}
.badge-trending{background:#FDEFE6; color:#B8541C;}

/* ===== Cards ===== */
.card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
.college-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
.college-card .toprow{display:flex; gap:10px; align-items:flex-start;}
.clogo{width:40px; height:40px; border-radius:9px; background:var(--indigo-light); color:var(--indigo); font-weight:800; font-family:'Manrope'; display:flex; align-items:center; justify-content:center; font-size:13px; flex:none;}
.college-card h4{font-size:14px; margin-bottom:2px;}
.college-card .city{font-size:12px; color:var(--sub);}
.stars{color:var(--indigo); font-size:14px; letter-spacing:1px;}
.badges-row{display:flex; gap:6px; margin-top:9px;}
.rating-row{display:flex; align-items:center; gap:6px; margin-top:10px; font-size:13px;}
.rating-row .count{color:var(--sub); font-size:12px;}

.review-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
.reviewer-row{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; margin-bottom:6px;}
.reviewer-row .meta{font-weight:400; color:var(--sub);}
.review-text{font-size:13.5px; line-height:1.6; margin:8px 0 10px;}
.review-footer{display:flex; justify-content:space-between; font-size:12px; color:var(--sub);}
.official-response{background:var(--indigo-light); border-radius:7px; padding:10px 12px; margin-top:8px; font-size:12.5px;}
.official-response .lbl{font-weight:700; color:var(--indigo); display:block; margin-bottom:3px; font-size:11.5px;}

.rbar-row{display:flex; align-items:center; gap:10px; font-size:12.5px; margin-bottom:8px;}
.rbar-row .cat{width:120px; flex:none; color:var(--sub);}
.rbar-track{flex:1; height:6px; background:var(--line); border-radius:999px; overflow:hidden;}
.rbar-fill{height:100%; background:var(--indigo); border-radius:999px;}
.rbar-val{width:28px; text-align:right; font-weight:600;}

/* ===== Tabs ===== */
.tabs{display:flex; gap:4px; background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:4px;}
.tab{flex:1; text-align:center; padding:9px 12px; font-size:12.5px; font-weight:600; color:var(--sub); border-radius:7px;}
.tab.active{background:var(--indigo); color:#fff;}

/* ===== Footer ===== */
.site-footer{background:#fff; border-top:1px solid var(--line); padding:36px 28px 24px;}
.footer-grid{display:grid; grid-template-columns:1.4fr repeat(4,1fr); gap:20px; font-size:12.5px;}
.footer-grid h5{font-size:11.5px; color:var(--sub); margin-bottom:10px; font-weight:600;}
.footer-grid a{display:block; color:#4B4F5E; margin-bottom:7px;}

/* ===== Dashboard shell (student/org/admin) ===== */
.dashwrap{display:flex; min-height:820px;}
.dsidebar{width:220px; flex:none; background:var(--indigo-deep); color:#fff; padding:18px 12px;}
.dsidebar .brand{display:flex; align-items:center; gap:8px; font-family:'Manrope'; font-weight:800; font-size:14px; padding:0 8px 18px;}
.dsidebar .brand .mark{width:22px; height:22px; border-radius:6px; background:#fff; color:var(--indigo); display:flex; align-items:center; justify-content:center; font-size:11px;}
.dsidebar a{display:flex; align-items:center; gap:9px; color:rgba(255,255,255,.6); font-size:12.8px; font-weight:500; padding:9px 11px; border-radius:8px; margin-bottom:2px;}
.dsidebar a.active{background:rgba(255,255,255,.1); color:#fff;}
.dsidebar .slabel{font-size:10.5px; color:rgba(255,255,255,.32); padding:14px 11px 5px; text-transform:uppercase; letter-spacing:.06em;}
.dmain{flex:1; background:var(--bg); padding:22px 26px;}
.dtopbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
.dtopbar .crumb{font-size:12px; color:var(--sub); margin-bottom:3px;}
.dtopbar h1{font-size:20px;}
.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
.kpi-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
.kpi-card .lbl{font-size:12px; color:var(--sub); margin-bottom:7px;}
.kpi-card .val{font-family:'Manrope'; font-weight:800; font-size:23px; margin-bottom:3px;}
.kpi-card .trend{font-size:11.5px; font-weight:600;}
.trend-up{color:var(--green);}
.trend-down{color:var(--red);}
.trend-warn{color:var(--amber);}

table.dt{width:100%; border-collapse:collapse; font-size:12.5px;}
table.dt th{text-align:left; color:var(--sub); font-weight:600; padding:9px 8px; border-bottom:1px solid var(--line); font-size:11.5px;}
table.dt td{padding:11px 8px; border-bottom:1px solid var(--line); vertical-align:top;}
.flag-tag{display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:6px; background:var(--red-bg); color:var(--red); margin-right:4px; margin-bottom:3px;}
.filters-row{display:flex; gap:8px; margin-bottom:14px;}
.filters-row input,.filters-row select{font-family:inherit; font-size:12.5px; padding:8px 11px; border-radius:7px; border:1px solid var(--line);}

/* ===== Auth ===== */
.authwrap{min-height:820px; display:flex; align-items:center; justify-content:center; background:var(--bg);}
.authcard{width:380px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:32px; box-shadow:var(--shadow);}
.authcard .logo{justify-content:center; margin-bottom:22px;}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:12.5px; font-weight:600;}
.field input,.field select,.field textarea{font-family:inherit; font-size:13.5px; padding:10px 12px; border-radius:7px; border:1px solid var(--line);}

/* ===== Wizard ===== */
.wizwrap{background:var(--bg); min-height:820px; display:flex; flex-direction:column; align-items:center; padding:36px 0 60px;}
.progress-track{width:480px; height:6px; background:var(--line); border-radius:999px; overflow:hidden; margin-bottom:8px;}
.progress-fill{height:100%; background:var(--indigo); border-radius:999px;}
.progress-label{width:480px; display:flex; justify-content:space-between; font-size:12px; color:var(--sub); margin-bottom:26px;}
.wizcard{width:480px;}
.option-card{border:1.5px solid var(--line); border-radius:10px; padding:15px; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:space-between; background:#fff; margin-bottom:9px;}
.option-card.selected{border-color:var(--indigo); background:var(--indigo-light); color:var(--indigo);}
.check-dot{width:17px; height:17px; border-radius:50%; border:1.5px solid var(--line); flex:none;}
.option-card.selected .check-dot{background:var(--indigo); border-color:var(--indigo);}

</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <div class="panel-head">
      <div class="brandrow"><span class="mark">CT</span><span class="ttl">CampusTruth</span></div>
      <div class="sub">Figma-ready screen set · 47 frames</div>
    </div>
    <div class="panel-scroll" id="pageList"></div>
    <div class="panel-foot"><b>Frame width</b> 1440px desktop.<br>Click a page to preview.</div>
  </div>
  <div class="canvas" id="canvas">
    <div class="frame-wrap" id="frameWrap"></div>
  </div>
</div>

<script>
const PAGES = [];

/* ---------- shared helpers ---------- */
function badge(kind, text){
  const map = {verified:'badge-verified', org:'badge-org', official:'badge-official', pending:'badge-pending', flagged:'badge-flagged', trending:'badge-trending'};
  return `<span class="badge ${map[kind]}">${text}</span>`;
}
function trustStrip(){
  return `<div class="topstrip"><div class="left"><span>12,400+ verified reviews</span><span>850+ colleges</span><span>100% anonymous</span></div><div class="right"><span>Help</span><span>For Colleges</span></div></div>`;
}
function siteHeader(loggedIn){
  return `<div class="site-header"><div class="header-row">
    <div class="logo"><span class="mark">CT</span>CampusTruth</div>
    <nav class="main-nav"><a>Colleges</a><a>Rankings</a><a>Compare</a></nav>
    <div class="header-search"><input placeholder="Search for a college or university..."><button>Search</button></div>
    <div class="header-actions">
      ${loggedIn ? `<span style="font-size:16px;">🔔</span><span style="font-size:16px;">☆</span><div class="avatar">RS</div>` : `<button class="btn btn-ghost btn-sm">Log in</button><button class="btn btn-primary btn-sm">Sign up</button>`}
    </div>
  </div></div>`;
}
function siteFooter(){
  return `<div class="site-footer"><div class="footer-grid">
    <div><div class="logo" style="margin-bottom:8px;"><span class="mark">CT</span>CampusTruth</div><p style="color:var(--sub); font-size:12px; max-width:200px;">Honest, anonymous college reviews for students across India.</p></div>
    <div><h5>Company</h5><a>About</a><a>Contact</a></div>
    <div><h5>Legal</h5><a>Privacy</a><a>Terms</a><a>Community Guidelines</a></div>
    <div><h5>Trust &amp; Safety</h5><a>Report Content</a><a>Review Guidelines</a><a>Org Response Policy</a></div>
    <div><h5>Follow</h5><a>Instagram</a><a>LinkedIn</a></div>
  </div></div>`;
}
function collegeCard(logo,name,city,rating,count,badges){
  return `<div class="college-card">
    <div class="toprow"><div class="clogo">${logo}</div><div><h4>${name}</h4><div class="city">${city}</div></div></div>
    <div class="badges-row">${badges.map(b=>badge(b[0],b[1])).join('')}</div>
    <div class="rating-row"><span class="stars">${stars(rating)}</span><span>${rating.toFixed(1)}</span><span class="count">· ${count} reviews</span></div>
  </div>`;
}
function stars(n){
  const full = Math.round(n);
  return '★★★★★'.slice(0,full) + '☆☆☆☆☆'.slice(0, 5-full);
}
function reviewCard(o){
  return `<div class="review-card">
    <div class="reviewer-row">${o.verified ? badge('verified','Verified Student') : 'Anonymous Student'}<span class="meta">${o.meta}</span></div>
    <div class="stars">${stars(o.rating)}</div>
    <p class="review-text">"${o.text}"</p>
    ${o.response ? `<div class="official-response"><span class="lbl">Official Response — ${o.responseFrom}</span>${o.response}</div>` : ''}
    <div class="review-footer"><span>${o.date}</span><span>👍 Helpful (${o.helpful}) · Share · Report</span></div>
  </div>`;
}
function rbar(cat,val,pct){
  return `<div class="rbar-row"><span class="cat">${cat}</span><div class="rbar-track"><div class="rbar-fill" style="width:${pct}%"></div></div><span class="rbar-val">${val}</span></div>`;
}
function kpi(label,val,trend,cls){
  return `<div class="kpi-card"><div class="lbl">${label}</div><div class="val">${val}</div><div class="trend ${cls}">${trend}</div></div>`;
}
function collegeTabs(active){
  const tabs=['Overview','Reviews','Questions','Placements','Courses','Jobs'];
  return `<div class="tabs">${tabs.map(t=>`<div class="tab ${t===active?'active':''}">${t}</div>`).join('')}</div>`;
}
function profileHeader(){
  return `<div style="padding:16px 28px 0;"><div style="font-size:12px; color:var(--sub); margin-bottom:10px;">Colleges / Delhi / IIT Delhi</div>
  <div class="card" style="display:flex; justify-content:space-between; margin-bottom:16px;">
    <div style="display:flex; gap:16px;">
      <div class="clogo" style="width:60px; height:60px; font-size:18px; border-radius:13px;">IIT</div>
      <div><div style="display:flex; align-items:center; gap:10px;"><h1 style="font-size:22px;">Indian Institute of Technology Delhi</h1>${badge('verified','✓ Verified')}</div>
      <div style="display:flex; gap:16px; margin-top:8px; font-size:13px; color:var(--sub);"><span>📍 Hauz Khas, New Delhi</span><span>🌐 iitd.ac.in</span><span>🏛 Est. 1961</span></div></div>
    </div>
    <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-end;">
      <div style="display:flex; gap:8px;"><button class="btn btn-ghost btn-sm">☆ Save</button><button class="btn btn-ghost btn-sm">Share</button></div>
      <button class="btn btn-primary btn-sm">Write a review</button>
    </div>
  </div>
  <div class="card" style="display:flex; gap:32px; margin-bottom:16px;">
    <div><div style="font-family:'Manrope'; font-weight:800; font-size:34px;">4.6</div><div class="stars" style="font-size:14px;">★★★★★</div><div style="font-size:12px; color:var(--sub); margin-top:3px;">1,204 reviews · 640 verified</div></div>
    <div style="flex:1; max-width:400px;">
      ${rbar('Placement','4.4',88)}${rbar('Faculty','4.6',92)}${rbar('Infrastructure','4.3',86)}${rbar('Administration','3.2',64)}
    </div>
  </div></div>`;
}
function dashSidebar(kind, active){
  const items = kind==='student' ? [
    ['📊','Dashboard','dashboard'],['💬','My Reviews','reviews'],['❓','My Questions','questions'],['🔖','Saved Colleges','saved'],['🔔','Notifications','notif'],['⚙️','Settings','settings']
  ] : kind==='org' ? [
    ['📊','Dashboard','dashboard'],['🏛','Profile','profile'],['💬','Reviews','reviews'],['❓','Questions','questions'],['📈','Analytics','analytics'],['😊','Sentiment','sentiment'],['💼','Jobs','jobs'],['👥','Team','team'],['⚙️','Settings','settings']
  ] : [
    ['📊','Dashboard','dashboard'],['👤','Users','users'],['🏛','Colleges','colleges'],['💬','Reviews','reviews'],['🚩','Reports','reports'],['🏢','Organizations','orgs'],['✅','Verifications','verif'],['💳','Payments','payments'],['📈','Analytics','analytics'],['⚙️','Settings','settings']
  ];
  const brand = kind==='student' ? 'CampusTruth' : kind==='org' ? 'IIT Delhi · Org' : 'CampusTruth Admin';
  return `<div class="dsidebar"><div class="brand"><span class="mark">CT</span>${brand}</div>
    ${items.map(i=>`<a class="${i[2]===active?'active':''}">${i[0]} ${i[1]}</a>`).join('')}
  </div>`;
}
function dtopbar(crumb,title,right){
  return `<div class="dtopbar"><div><div class="crumb">${crumb}</div><h1>${title}</h1></div><div>${right||''}</div></div>`;
}

/* ================= PUBLIC ================= */
PAGES.push({id:1, group:'Public — Discovery', label:'Homepage', render:()=>`
${trustStrip()}${siteHeader(false)}
<div style="background:var(--indigo); color:#fff; padding:56px 24px 48px; text-align:center;">
  <h1 style="font-size:38px; max-width:620px; margin:0 auto 12px; line-height:1.15;">Know what students really think.</h1>
  <p style="color:rgba(255,255,255,.82); max-width:520px; margin:0 auto 26px; font-size:15px;">Explore honest student experiences, ratings and reviews of colleges and universities across India.</p>
  <div style="background:#fff; border-radius:14px; padding:7px; display:flex; gap:8px; max-width:540px; margin:0 auto; box-shadow:0 8px 24px rgba(0,0,0,.18);">
    <input style="flex:1; border:none; outline:none; padding:10px 12px; font-size:14px; font-family:inherit;" placeholder="Search for a college or university...">
    <button class="btn btn-primary">Search</button>
  </div>
  <div style="margin-top:16px; font-size:12.5px; color:rgba(255,255,255,.75);">Popular: <b>IIT Delhi</b> · <b>Delhi University</b> · <b>Amity University</b> · <b>Chandigarh University</b></div>
</div>
<div style="padding:36px 28px;">
  <h3 style="margin-bottom:16px;">Trending this week</h3>

function wizShell(step,total,label,inner){
  return `<div class="wizwrap">
    <div class="progress-track"><div class="progress-fill" style="width:${(step/total)*100}%"></div></div>
    <div class="progress-label" style="width:480px;"><span>Step ${step} of ${total}</span><span>${label}</span></div>
    <div class="wizcard">${inner}</div>
  </div>`;
}

/* ---------- render engine ---------- */
const list = document.getElementById('pageList');
const wrap = document.getElementById('frameWrap');
let groups = {};
PAGES.forEach(p=>{ (groups[p.group] = groups[p.group]||[]).push(p); });
let html='';
Object.keys(groups).forEach(g=>{
  html += `<div class="group-label">${g}</div>`;
  groups[g].forEach(p=>{
    html += `<div class="page-item" data-id="${p.id}"><span class="num">${p.id}</span>${p.label}</div>`;
  });
});
list.innerHTML = html;

function renderPage(id){
  const p = PAGES.find(x=>x.id===id);
  document.querySelectorAll('.page-item').forEach(el=>el.classList.toggle('active', el.dataset.id==id));
  wrap.innerHTML = `<div class="frame-label"><span class="dot"></span>${String(id).padStart(2,'0')}. ${p.label}</div><div class="frame">${p.render()}</div>`;
  document.getElementById('canvas').scrollTop = 0;
}
list.addEventListener('click', e=>{
  const item = e.target.closest('.page-item');
  if(item) renderPage(Number(item.dataset.id));
});
renderPage(1);
</script>
